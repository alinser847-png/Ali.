name: Build ABO LANA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q ABO_LANA_Android_Project.zip -d project

          ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            exit 1
          fi

          cp -R "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABO-LANA-APK
          path: app/build/outputs/apk/debug/*.apk
